name: Check profile assets

on:
  push:
    paths: ['README.md', 'docs/**', 'scripts/**', 'assets/**', '.github/workflows/profile.yml']
  pull_request:
    paths: ['README.md', 'docs/**', 'scripts/**', 'assets/**', '.github/workflows/profile.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  assets:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: python3 scripts/build_assets.py --check
