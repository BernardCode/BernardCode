<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117">
        <animate attributeName="stop-color" values="#0d1117;#111827;#0d1117" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#172554">
        <animate attributeName="stop-color" values="#172554;#312e81;#172554" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#164e63;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>

  <g fill="#60a5fa" opacity=".22">
    <circle cx="95" cy="65" r="3"><animate attributeName="cy" values="65;48;65" dur="4s" repeatCount="indefinite"/></circle>
    <circle cx="170" cy="190" r="5"><animate attributeName="cy" values="190;165;190" dur="6s" repeatCount="indefinite"/></circle>
    <circle cx="1030" cy="72" r="4"><animate attributeName="cy" values="72;92;72" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="1110" cy="185" r="3"><animate attributeName="cy" values="185;160;185" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="925" cy="210" r="5"><animate attributeName="cy" values="210;188;210" dur="7s" repeatCount="indefinite"/></circle>
  </g>

  <text x="600" y="105" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="52" font-weight="700" fill="#f8fafc" letter-spacing="4" filter="url(#glow)">
    BERNARD FREUND
  </text>
  <text x="600" y="152" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="20" fill="#bfdbfe" letter-spacing="2">
    SOFTWARE • MACHINE LEARNING • EMBEDDED SYSTEMS
  </text>
  <line x1="360" y1="185" x2="840" y2="185" stroke="#60a5fa" stroke-width="2" opacity=".65">
    <animate attributeName="x1" values="500;360;500" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="x2" values="700;840;700" dur="5s" repeatCount="indefinite"/>
  </line>
</svg>