<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Bernard Freund</title>
  <desc id="desc">Student developer in the Bay Area. Three circuit traces form a lowercase b. A signal passes through once, then rests.</desc>
  <defs>
    <radialGradient id="wash"><stop stop-color="#087f70" stop-opacity=".14"/><stop offset="1" stop-color="#087f70" stop-opacity="0"/></radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#087f70"/><stop offset="1" stop-color="#526870" stop-opacity=".35"/></linearGradient>
    <clipPath id="bounds"><rect width="960" height="340" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #f6f9fa; }
.panel { fill: #ffffff; }
.ink { fill: #17282e; }
.muted { fill: #526870; }
.line { fill: #d9e4e7; }
.accent { fill: #087f70; }
.faint { fill: #dcefeb; }
.white { fill: #eef4f6; }
    .border { stroke: #d9e4e7; stroke-width: 1; }
    .wire { fill: none; stroke: #d9e4e7; stroke-width: 1.5; }
    .signal { fill: none; stroke: #087f70; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

    .trace { stroke-dasharray: 76 1100; stroke-dashoffset: 1176; opacity: 0; }
    @media (prefers-reduced-motion: no-preference) {
      .trace { animation: travel 4s ease-in-out 0.4s 1; }
    }
    @keyframes travel {
      0% { stroke-dashoffset: 1176; opacity: 0; }
      15%, 80% { opacity: 1; }
      100% { stroke-dashoffset: 0; opacity: 0; }
    }

  </style>
  <g clip-path="url(#bounds)">
    <rect x="0" y="0" width="960" height="340" rx="16" class="bg" />
    <g transform="translate(575 28)"><circle cx="194" cy="133" r="190" fill="url(#wash)"/><path d="M 4 33 H 107 Q 131 33 131 57 V 187 Q 131 234 195 234 H 210 Q 275 234 275 171 Q 275 111 214 111 H 168 Q 142 111 142 137 V 165 Q 142 186 183 186 H 325" fill="none" stroke="url(#wire)" stroke-width="1.4"/><circle cx="4" cy="33" r="3" class="accent"/><path d="M 4 44 H 118 Q 142 44 142 68 V 176 Q 142 223 195 223 H 210 Q 264 223 264 171 Q 264 122 214 122 H 179 Q 153 122 153 142 V 165 Q 153 182 183 182 H 325" fill="none" stroke="url(#wire)" stroke-width="1.4"/><path d="M 4 44 H 118 Q 142 44 142 68 V 176 Q 142 223 195 223 H 210 Q 264 223 264 171 Q 264 122 214 122 H 179 Q 153 122 153 142 V 165 Q 153 182 183 182 H 325" class="signal trace"/><circle cx="4" cy="44" r="3" class="accent"/><path d="M 4 55 H 129 Q 153 55 153 79 V 165 Q 153 212 195 212 H 210 Q 253 212 253 171 Q 253 133 214 133 H 190 Q 164 133 164 147 V 165 Q 164 178 183 178 H 325" fill="none" stroke="url(#wire)" stroke-width="1.4"/><circle cx="4" cy="55" r="3" class="accent"/><circle cx="325" cy="182" r="4" class="accent"/><path d="M65 113h6 M68 110v6" class="wire"/><path d="M299 60h6 M302 57v6" class="wire"/><path d="M65 233h6 M68 230v6" class="wire"/><path d="M302 247h6 M305 244v6" class="wire"/></g><text x="44" y="52" class="muted" font-size="13" font-weight="500" letter-spacing="2.5">BERNARDCODE</text><text x="39" y="144" class="ink" font-size="84" font-weight="650" letter-spacing="-4.5">Bernard</text><text x="39" y="235" class="ink" font-size="84" font-weight="650" letter-spacing="-4.5">Freund.</text><text x="44" y="293" class="muted" font-size="21" font-weight="400" >Student developer · Bay Area</text>
  </g>
  <rect x=".5" y=".5" width="959" height="339" rx="15.5" fill="none" class="border"/>
</svg>
