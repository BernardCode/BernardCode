<svg xmlns="http://www.w3.org/2000/svg" width="480" height="300" viewBox="0 0 480 300" role="img" aria-labelledby="title desc">
  <title id="title">LocatED — matching and verification</title>
  <desc id="desc">Text, visual description, recency, location, and category inform ranked candidates. Ownership verification is a separate step; this diagram shows architecture, not measured results.</desc>
  <defs>
    <radialGradient id="wash"><stop stop-color="#1765ca" stop-opacity=".14"/><stop offset="1" stop-color="#1765ca" stop-opacity="0"/></radialGradient>
    <linearGradient id="wire" gradientUnits="userSpaceOnUse" x1="660" y1="0" x2="900" y2="340"><stop stop-color="#235da6"/><stop offset=".55" stop-color="#3f8ae0"/><stop offset="1" stop-color="#8dcfff"/></linearGradient>
    <filter id="bloom" x="-30%" y="-40%" width="160%" height="180%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="8"/></filter>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation=".65"/></filter>
    <clipPath id="bounds"><rect width="480" height="300" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #f3f8ff; }
.panel { fill: #ffffff; }
.ink { fill: #15294d; }
.muted { fill: #526a8c; }
.line { fill: #d6e3f5; }
.accent { fill: #1765ca; }
.faint { fill: #e0efff; }
.white { fill: #edf4fc; }
    .border { stroke: #d6e3f5; stroke-width: 1; }
    .wire { fill: none; stroke: #d6e3f5; stroke-width: 1.5; }
    .signal { fill: none; stroke: #1765ca; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  </style>
  <g clip-path="url(#bounds)">
    <rect x="0" y="0" width="480" height="300" rx="16" class="bg" />
    <text x="26" y="41" class="ink" font-size="23" font-weight="550" >Evidence → candidates → claim</text><rect x="26" y="69" width="91" height="35" rx="8" class="panel" /><text x="40" y="93" class="muted" font-size="20" font-weight="400" >Text</text><rect x="128" y="69" width="100" height="35" rx="8" class="panel" /><text x="142" y="93" class="muted" font-size="20" font-weight="400" >Visual</text><rect x="239" y="69" width="119" height="35" rx="8" class="panel" /><text x="253" y="93" class="muted" font-size="20" font-weight="400" >Recency</text><rect x="26" y="115" width="135" height="35" rx="8" class="panel" /><text x="40" y="139" class="muted" font-size="20" font-weight="400" >Location</text><rect x="172" y="115" width="135" height="35" rx="8" class="panel" /><text x="186" y="139" class="muted" font-size="20" font-weight="400" >Category</text><path d="M26 177h427" class="wire"/><rect x="26" y="202" width="187" height="60" rx="10" class="faint" /><text x="43" y="239" class="accent" font-size="20" font-weight="550" >Ranked matches</text><path d="M222 232h23m-5-5 5 5-5 5" class="signal"/><rect x="259" y="202" width="194" height="60" rx="10" class="panel" /><text x="276" y="239" class="ink" font-size="20" font-weight="550" >Verify ownership</text>
  </g>
  <rect x=".5" y=".5" width="479" height="299" rx="15.5" fill="none" class="border"/>
</svg>
