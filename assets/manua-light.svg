ircle cx="140" cy="111" r="3.5" class="panel" stroke="currentColor"/><circle cx="153" cy="83" r="3.5" class="panel" stroke="currentColor"/><circle cx="160" cy="64" r="3.5" class="panel" stroke="currentColor"/><circle cx="166" cy="47" r="3.5" class="panel" stroke="currentColor"/></g></g><path d="M44 194h165" class="wire"/><circle cx="44" cy="194" r="3" class="accent"/><rect x="434" y="20" width="506" height="220" rx="12" class="panel" /><text x="458" y="60" class="ink" font-size="22" font-weight="550" >Practice feedback</text><text x="458" y="88" class="muted" font-size="16" font-weight="400" >Scripted example</text><rect x="458" y="111" width="51" height="46" rx="8" class="white" /><text x="483.5" y="142" class="ink" font-size="25" font-weight="500" text-anchor="middle">M</text><rect x="517" y="111" width="51" height="46" rx="8" class="white" /><text x="542.5" y="142" class="ink" font-size="25" font-weight="500" text-anchor="middle">A</text><rect x="576" y="111" width="51" height="46" rx="8" class="white" /><text x="601.5" y="142" class="ink" font-size="25" font-weight="500" text-anchor="middle">R</text><rect x="635" y="111" width="51" height="46" rx="8" class="white" /><text x="660.5" y="142" class="ink" font-size="25" font-weight="500" text-anchor="middle">T</text><rect x="694" y="111" width="51" height="46" rx="8" class="faint" /><text x="719.5" y="142" class="accent" font-size="25" font-weight="500" text-anchor="middle">E</text><rect x="753" y="111" width="51" height="46" rx="8" class="white" /><text x="778.5" y="142" class="ink" font-size="25" font-weight="500" text-anchor="middle">N</text><rect x="458" y="166" width="51" height="46" rx="8" class="white" /><text x="483.5" y="197" class="ink" font-size="25" font-weight="500" text-anchor="middle">M</text><rect x="517" y="166" width="51" height="46" rx="8" class="white" /><text x="542.5" y="197" class="ink" font-size="25" font-weight="500" text-anchor="middle">A</text><rect x="576" y="166" width="51" height="46" rx="8" class="white" /><text x="601.5" y="197" class="ink" font-size="25" font-weight="500" text-anchor="middle">R</text><rect x="635" y="166" width="51" height="46" rx="8" class="white" /><text x="660.5" y="197" class="ink" font-size="25" font-weight="500" text-anchor="middle">T</text><rect x="694" y="166" width="51" height="46" rx="8" class="faint" /><text x="719.5" y="197" class="accent" font-size="25" font-weight="500" text-anchor="middle">I</text><rect x="753" y="166" width="51" height="46" rx="8" class="white" /><text x="778.5" y="197" class="ink" font-size="25" font-weight="500" text-anchor="middle">N</text><text x="835" y="143" class="muted" font-size="16" font-weight="400" >typed</text><text x="835" y="198" class="muted" font-size="16" font-weight="400" >target</text>
