<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Bernard Freund</title>
  <desc id="desc">Student developer in the Bay Area. Four evenly spaced blue ribbons sweep beyond the card edges.</desc>
