<svg xmlns="http://www.w3.org/2000/svg" width="960" height="240" viewBox="0 0 960 240" role="img" aria-labelledby="title desc">
  <title id="title">LocatED — matching and verification</title>
  <desc id="desc">Text, visual description, recency, location, and category inform ranked candidates. Ownership verification is a separate step; this diagram shows architecture, not measured results.</desc>
  <defs>
    <radialGradient id="wash"><stop stop-color="#75e1cc" stop-opacity=".14"/><stop offset="1" stop-color="#75e1cc" stop-opacity="0"/></radialGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#75e1cc"/><stop offset="1" stop-color="#9eafb9" stop-opacity=".35"/></linearGradient>
    <clipPath id="bounds"><rect width="960" height="240" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace; }
    .bg { fill: #0d1117; }
.panel { fill: #111b22; }
.ink { fill: #edf4f7; }
.muted { fill: #9eafb9; }
.line { fill: #293840; }
.accent { fill: #75e1cc; }
.faint { fill: #163b38; }
.white { fill: #17252c; }
    .border { stroke: #293840; stroke-width: 1; }
    .wire { fill: none; stroke: #293840; stroke-width: 1.5; }
    .signal { fill: none; stroke: #75e1cc; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  </style>
  <g clip-path="url(#bounds)">
    <rect x="0" y="0" width="960" height="240" rx="16" class="bg" />
    <text x="34" y="48" class="muted" font-size="17" font-weight="400" >Evidence</text><rect x="34" y="73" width="86" height="42" rx="9" class="panel" /><text x="49" y="101" class="muted" font-size="18" font-weight="400" >Text</text><rect x="132" y="73" width="99" height="42" rx="9" class="panel" /><text x="147" y="101" class="muted" font-size="18" font-weight="400" >Visual</text><rect x="243" y="73" width="119" height="42" rx="9" class="panel" /><text x="258" y="101" class="muted" font-size="18" font-weight="400" >Recency</text><rect x="34" y="132" width="131" height="42" rx="9" class="panel" /><text x="49" y="160" class="muted" font-size="18" font-weight="400" >Location</text><rect x="177" y="132" width="132" height="42" rx="9" class="panel" /><text x="192" y="160" class="muted" font-size="18" font-weight="400" >Category</text><path d="M374 94h28q18 0 18 18v9h29 M321 153h80q19 0 19-19v-13" class="wire"/><rect x="454" y="73" width="214" height="101" rx="12" class="faint" /><text x="478" y="113" class="accent" font-size="22" font-weight="550" >Ranked</text><text x="478" y="144" class="accent" font-size="22" font-weight="550" >matches</text><path d="M682 122h41m-6-6 6 6-6 6" class="signal"/><rect x="738" y="73" width="188" height="101" rx="12" class="panel" /><text x="762" y="113" class="ink" font-size="22" font-weight="550" >Verify</text><text x="762" y="144" class="ink" font-size="22" font-weight="550" >ownership</text><text x="454" y="211" class="muted" font-size="17" font-weight="400" >A suggestion is not proof of ownership.</text>
  </g>
  <rect x=".5" y=".5" width="959" height="239" rx="15.5" fill="none" class="border"/>
</svg>
