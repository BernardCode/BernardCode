.white { fill: #192b43; }
    .border { stroke: #283a55; stroke-width: 1; }
    .wire { fill: none; stroke: #283a55; stroke-width: 1.5; }
    .signal { fill: none; stroke: #68b9ff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

