<svg xmlns="http://www.w3.org/2000/svg" width="480" height="320" viewBox="0 0 480 320" role="img" aria-labelledby="title desc">
  <title id="title">Bernard Freund</title>
  <desc id="desc">Student developer in the Bay Area. Four evenly spaced blue ribbons sweep beyond the card edges.</desc>
  <defs>
    <radialGradient id="wash"><stop stop-color="#68b9ff" stop-opacity=".14"/><stop offset="1" stop-color="#68b9ff" stop-opacity="0"/></radialGradient>
